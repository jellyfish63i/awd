<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쿠폰북</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(circle at 50% 0%, #3a2230 0%, #15141a 65%) fixed;
    font-family: "Gowun Batang", "Malgun Gothic", serif;
    color: #ece3dc;
    padding: 40px 16px 60px;
    box-sizing: border-box;
  }
  h1 { text-align: center; font-weight: 400; font-size: 26px; margin: 0 0 6px; letter-spacing: .1em; color: #e8d3b9; }
  .sub { text-align: center; color: #a79d98; font-size: 15px; margin-bottom: 32px; }
  #list { max-width: 440px; margin: 0 auto; display: grid; gap: 16px; }
  .coupon {
    position: relative;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(135deg, #5a2b3c, #3a1f2b);
    border: 1px solid rgba(201,162,126,.45);
    border-radius: 14px;
    padding: 20px 22px;
    cursor: pointer;
    overflow: hidden;
    transition: transform .2s;
  }
  .coupon:hover { transform: translateY(-2px); }
  .coupon::before, .coupon::after {
    content: ""; position: absolute; top: 50%; width: 18px; height: 18px;
    background: #1b1419; border-radius: 50%; transform: translateY(-50%);
    border: 1px solid rgba(201,162,126,.45);
  }
  .coupon::before { left: -10px; }
  .coupon::after { right: -10px; }
  .info { padding: 0 6px; }
  .info b { display: block; font-size: 20px; font-weight: 700; color: #f0e2cf; margin-bottom: 4px; }
  .info span { font-size: 14px; color: #c8b8ae; }
  .tag { font-size: 13px; color: #c9a27e; border: 1px solid rgba(201,162,126,.5); border-radius: 999px; padding: 4px 12px; white-space: nowrap; }
  .stamp {
    position: absolute; right: 18px; top: 50%;
    transform: translateY(-50%) rotate(-14deg) scale(2);
    border: 3px solid #c97b8b; color: #c97b8b;
    font-size: 20px; font-weight: 700; padding: 4px 12px; border-radius: 8px;
    opacity: 0; pointer-events: none; letter-spacing: .1em;
  }
  .coupon.used { filter: saturate(.4) brightness(.8); }
  .coupon.used .stamp { opacity: .9; transform: translateY(-50%) rotate(-14deg) scale(1); transition: transform .25s cubic-bezier(.2,1.6,.4,1), opacity .2s; }
  .coupon.used .tag { opacity: .3; }
  .float { position: fixed; bottom: -30px; pointer-events: none; color: #c97b8b; opacity: .4; animation: up linear forwards; z-index: 0; }
  @keyframes up { to { transform: translateY(-115vh); opacity: 0; } }
</style>
</head>
<body>
<h1>COUPON BOOK</h1>
<div class="sub">눌러서 사용하세요</div>
<div id="list"></div>

<script>
  // ↓ 쿠폰 목록 (제목, 설명, 태그)
  const COUPONS = [
    ["키스 쿠폰", "언제 어디서든 1회, 거절 불가", "1회"],
    ["안아주기 쿠폰", "말없이 5분 동안 꼭 안아주기", "무제한"],
    ["손잡고 산책 쿠폰", "저녁 공기 마시며 천천히 걷기", "1회"],
    ["팔베개 쿠폰", "영화 보다가 팔베개 해주기", "1회"],
    ["머리 쓰다듬기 쿠폰", "오늘 수고했다고 쓰다듬어 주기", "3회"],
    ["소원 쿠폰", "무엇이든 하나 들어주기", "1회"],
    ["데이트 코스 선택 쿠폰", "오늘은 네가 정하는 날", "1회"],
    ["이마 뽀뽀 쿠폰", "자기 전에 이마에 살짝", "3회"]
  ];

  const list = document.getElementById("list");
  COUPONS.forEach(([title, desc, tag]) => {
    const el = document.createElement("div");
    el.className = "coupon";
    el.innerHTML =
      '<div class="info"><b>' + title + '</b><span>' + desc + '</span></div>' +
      '<div class="tag">' + tag + '</div>' +
      '<div class="stamp">사용 완료</div>';
    el.addEventListener("click", () => el.classList.toggle("used"));
    list.appendChild(el);
  });

  const CH = ["♥", "✦", "·"];
  function spawn() {
    const s = document.createElement("span");
    s.className = "float";
    s.textContent = CH[Math.floor(Math.random() * CH.length)];
    s.style.left = Math.random() * 100 + "vw";
    s.style.fontSize = 12 + Math.random() * 16 + "px";
    s.style.animationDuration = 7 + Math.random() * 5 + "s";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 12000);
  }
  setInterval(spawn, 1000);
</script>
</body>
</html>
